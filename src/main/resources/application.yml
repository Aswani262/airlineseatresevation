spring:
  application:
    name: airline-seat-booking

  datasource:
    url: jdbc:postgresql://localhost:5432/airlinebooking?stringtype=unspecified
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: never   # or "always" if you want schema.sql/data.sql to run

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO

    # Application logs
    com.example.airlinebooking: DEBUG

    # Spring internals (keep INFO in prod)
    org.springframework: DEBUG

    # Spring JDBC SQL logs
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE

    # Hikari connection pool
    com.zaxxer.hikari: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{36} - %msg%n"

  elasticsearch:
    uris: http://localhost:9200
